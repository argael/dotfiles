# -----------------------------------------------------------------------------
#   Global parameters
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"

set -g mouse on
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed

set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

set -g default-terminal "${TERM}"
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# -----------------------------------------------------------------------------
#   Plugins
# -----------------------------------------------------------------------------

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# -----------------------------------------------------------------------------
#   Plugin Manager (out of Stow)
# -----------------------------------------------------------------------------

# Keep TPM-managed plugins outside the stowed ~/.config/tmux path.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

if-shell '[ -x "$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm" ]' \
  "run '$HOMEBREW_PREFIX/opt/tpm/share/tpm/tpm'" \
  "run '$HOME/.tmux/plugins/tpm/tpm'"

# Project session launcher
bind-key P run-shell "$HOME/.local/bin/tmux-sessionizer"
